name: ci

# AIEF-001 AC13 — the engine runs on three platforms from one source, with no
# platform branch. AC14 — AIEF composes its own repository as part of CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: format
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: compose (dogfooding — AC14)
        run: npm run compose

      - name: health (AIEF-002 — §48 health checks and §55 layer boundaries)
        run: npm run health

  parity:
    # ADR-0002 — the prose specification and the rule sidecar must agree.
    # A rule that exists in one and not the other is a Foundation defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-parity.js
      - run: node scripts/schemas.js
